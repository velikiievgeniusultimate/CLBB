server {
    listen 80;
    server_name clbb-downloads.velikiievgenius.com;
    access_log off;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /srv/clbb/acme; }
    location / { return 301 https://clbb-downloads.velikiievgenius.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name clbb-downloads.velikiievgenius.com;
    ssl_certificate /etc/letsencrypt/live/clbb-downloads.velikiievgenius.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clbb-downloads.velikiievgenius.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CLBB_TLS:1m;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/clbb-error.log warn;
    keepalive_timeout 15;
    sendfile on;
    tcp_nopush on;
    max_ranges 1;
    limit_conn clbb_per_ip 4;
    location = /health { default_type text/plain; return 200 'CLBB downloads\n'; }
    location = /apk/mlbb-2.2.16.12321.apk {
        root /srv/clbb;
        try_files $uri =404;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="mlbb-2.2.16.12321.apk"';
        add_header Cache-Control 'public, max-age=604800, immutable';
        limit_except GET { deny all; }
    }
    location / { return 404; }
}
