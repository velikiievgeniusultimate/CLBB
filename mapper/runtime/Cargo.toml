[package]
name = "clbb-mapper"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clbb-moba-core = { path = "../core" }
serde = { version = "=1.0.219", features = ["derive", "rc"] }
serde_json = "=1.0.140"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
